# STAGED TEMPLATE: not installed on the live server.
# Include INSIDE the existing syntaxsurge.com HTTPS server after removing the
# former WordPress location / from its rewrite include. Do not create two / blocks.
# Preserve all TLS, ACME, PHP, security, and /kaldi-coffee locations.
# See docs/DEPLOY-SYNTAXSURGE.md before use.

# Replaces the WordPress catch-all only. More specific locations still win.
location / {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host syntaxsurge.com;
    proxy_set_header X-Forwarded-Host syntaxsurge.com;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    proxy_cache off;
    proxy_buffering off;
    proxy_intercept_errors off;
    expires off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    client_max_body_size 1m;
}

